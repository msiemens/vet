[package]
name = "module-cycles"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: not a member of the repository workspace, so Vet's builds never compile
# rust-analyzer. The rust-analyzer versions are those of the cargo-modules release whose
# module graph this tool reproduces; Cargo.lock is that release's.
[workspace]

[dependencies]
anyhow = "1"
ra_ap_cfg = "=0.0.345"
ra_ap_hir = "=0.0.345"
ra_ap_ide = "=0.0.345"
ra_ap_ide_db = "=0.0.345"
ra_ap_load-cargo = "=0.0.345"
ra_ap_paths = "=0.0.345"
ra_ap_project_model = "=0.0.345"
ra_ap_vfs = "=0.0.345"
