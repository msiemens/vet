[package]
name = "vet-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Use cases and the ports they need. Must not depend on vet-infra
# (ci/check-deps.sh); adapters implement these ports from the outside.
[dependencies]
vet-core.workspace = true
vet-semantic.workspace = true
vet-engine.workspace = true
# The runtime-agnostic async mutex that serializes a session's review state, the
# timeout on a CLI tool's answer, and the worktree file whose text the semantic
# layer compares a revision's with (D97), and the tasks a project's background runs are.
tokio = { workspace = true, features = ["sync", "time", "fs", "rt"] }
# Asking a platform for several commits' checks at once, and containing a panic in a background run.
futures = { workspace = true, features = ["alloc", "std"] }
# What `az` prints, and the stored form of what a platform said of a pull request.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
# The names in a remote URL, which may come escaped or not.
percent-encoding.workspace = true

[dev-dependencies]
# The worktree directories the semantic tests ask over.
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
# Reading what a background run logs.
tracing-subscriber = { workspace = true, features = ["fmt"] }

[features]
# The store-port contract (`store_contract.rs`): not needed in the product, compiled for the
# tests that run it and by `vet-infra`'s tests through its dev-dependency.
contract = []

[lints]
workspace = true
