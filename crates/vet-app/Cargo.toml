[package]
name = "vet-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Use cases and the ports they need. Must not depend on vet-infra
# (ci/check-deps.sh); adapters implement these ports from the outside.
[dependencies]
vet-core.workspace = true
vet-semantic.workspace = true
serde_json = "1.0"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
# Only the runtime-agnostic async mutex that serializes a session's review state.
tokio = { version = "1.53.2", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "time"] }

[lints]
workspace = true
