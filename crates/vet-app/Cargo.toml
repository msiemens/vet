[package]
name = "vet-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Use cases and the ports they need. Must not depend on vet-infra
# (ci/check-deps.sh); adapters implement these ports from the outside.
[dependencies]
vet-core.workspace = true
vet-semantic.workspace = true
vet-engine.workspace = true
# The runtime-agnostic async mutex that serializes a session's review state, and the
# timeout on a CLI tool's answer.
tokio = { workspace = true, features = ["sync", "time"] }
# Asking a platform for several commits' checks at once.
futures = { workspace = true, features = ["alloc"] }
# What `az` prints, and the stored form of what a platform said of a pull request.
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
# The names in a remote URL, which may come escaped or not.
percent-encoding.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
