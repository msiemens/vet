[package]
name = "vet-log"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Vet's one log: the subscriber the backend and the shell install, and where its file lives.
# Depends on no other crate of the workspace, so the shell, which is built on its own, can use it.
[dependencies]
dirs.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "std", "tracing-log", "ansi"] }

[lints]
workspace = true
