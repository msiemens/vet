[package]
name = "vet-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Pure and synchronous: no IO, no git types, no async runtime (ci/check-deps.sh).
[dependencies]
blake3 = { workspace = true, features = ["pure", "std"] }
globset.workspace = true
icu_collator.workspace = true
# The line diff gitoxide uses, so hunks match what git shows.
imara-diff.workspace = true
serde.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
