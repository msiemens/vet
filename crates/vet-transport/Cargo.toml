[package]
name = "vet-transport"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The authenticated loopback WebSocket server, shared by the real backend and the
# mock orchestrator for the shell spike. Depends only on vet-protocol.
[dependencies]
vet-protocol.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = "1"
getrandom = "0.4"
hex = "0.4"
subtle = "2"

[lints]
workspace = true
