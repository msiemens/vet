[package]
name = "vet-infra"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Adapters: one module per port. Dependencies (gix, notify, an HTTP client)
# arrive with their module.
[dependencies]
vet-core.workspace = true
vet-semantic.workspace = true
vet-app.workspace = true
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "rt", "process", "io-util", "fs"] }
dirs = "7.0.0"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
gix = { version = "0.88", default-features = false, features = ["sha1", "index", "dirwalk", "excludes", "attributes", "blob-diff", "worktree-mutation", "revision", "blocking-network-client", "blocking-http-transport-reqwest"] }
lsp-types = "0.97"
serde_json = "1.0.151"
toml = { version = "1.1", default-features = false, features = ["parse", "serde"] }
globset = { version = "0.4.20", default-features = false }
url = "2.5.8"
# The HTTP client for the hosting platforms. rustls with the operating system's trust
# store (a company CA is trusted as in the browser) and the `ring` provider, which the
# database driver already builds; the system proxy settings apply.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "system-proxy", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
octocrab = { version = "0.54.2", default-features = false, features = ["reqwest", "retry", "jwt-rust-crypto"] }
azure_devops_rust_api = { version = "0.39.1", default-features = false, features = ["reqwest", "git", "ims", "profile"] }
azure_core = { version = "1", default-features = false, features = ["reqwest"] }
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["alloc"] }

[target.'cfg(not(windows))'.dependencies]
notify = "8.2.0"
# Signalling a run's process group, without `unsafe`.
rustix = { version = "1.1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
