[package]
name = "vet-infra"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Adapters: one module per port. Dependencies (gix, notify, an HTTP client)
# arrive with their module, behind features where they are heavy.
[features]
default = []
# GitHub and Azure DevOps adapters (M2).
platform = []

[dependencies]
vet-core.workspace = true
vet-semantic.workspace = true
vet-app.workspace = true
notify = "8.2.0"
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "rt", "process", "io-util", "fs"] }
dirs = "7.0.0"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
gix = { version = "0.88", default-features = false, features = ["sha1", "index", "dirwalk", "excludes", "attributes", "blob-diff", "worktree-mutation"] }
unicode-normalization = "0.1"
lsp-types = "0.97"
serde_json = "1.0.151"
url = "2.5.8"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
