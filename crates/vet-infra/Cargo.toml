[package]
name = "vet-infra"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Adapters: one module per port. Dependencies (gix, notify, an HTTP client)
# arrive with their module.
[dependencies]
vet-core.workspace = true
vet-semantic.workspace = true
vet-app.workspace = true
vet-log.workspace = true
vet-engine.workspace = true
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "process", "io-util", "fs"] }
dirs.workspace = true
sea-orm = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { workspace = true, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
gix = { workspace = true, features = ["sha1", "parallel", "index", "dirwalk", "excludes", "attributes", "blob-diff", "worktree-mutation", "revision", "merge", "blocking-network-client", "blocking-http-transport-reqwest"] }
lsp-types.workspace = true
serde_json.workspace = true
toml = { workspace = true, features = ["parse", "serde"] }
globset.workspace = true
regex = { workspace = true, features = ["std", "perf", "unicode"] }
# Reads which anchors a search pattern has.
regex-syntax = { workspace = true, features = ["std", "unicode"] }
url.workspace = true
# The HTTP client for the hosting platforms. rustls with the operating system's trust
# store (a company CA is trusted as in the browser) and the `ring` provider, which the
# database driver already builds; the system proxy settings apply.
reqwest = { workspace = true, features = ["rustls-no-provider", "system-proxy", "json"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
# The platform API crates send their requests through the `reqwest` client above.
# octocrab needs exactly one JWT backend; `jwt-aws-lc-rs` reuses the aws-lc that
# `azure_core` always compiles (its TLS provider), where `jwt-rust-crypto` would add
# its own RSA and elliptic-curve crates. aws-lc is not used for TLS: `ring` is
# installed as the default.
octocrab = { workspace = true, features = ["reqwest", "retry", "jwt-aws-lc-rs"] }
azure_devops_rust_api = { workspace = true, features = ["reqwest", "git", "ims", "build", "policy"] }
azure_core = { workspace = true, features = ["reqwest"] }
async-trait.workspace = true
# Failures of the platforms are logged as structured events; the subscriber is the binary's.
tracing.workspace = true
futures = { workspace = true, features = ["alloc"] }
tower = { workspace = true, features = ["retry"] }
http.workspace = true
# The times the platforms write.
time = { workspace = true, features = ["parsing", "macros"] }

[target.'cfg(not(windows))'.dependencies]
notify.workspace = true
# Signalling a run's process group, and syncing content (`fsync`, Apple's `F_FULLFSYNC`),
# without `unsafe`.
rustix = { workspace = true, features = ["process", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
