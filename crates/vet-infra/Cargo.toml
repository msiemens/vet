[package]
name = "vet-infra"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Adapters: one module per port. Dependencies (gix, rusqlite, notify, an HTTP
# client) arrive with their module, behind features where they are heavy.
[features]
default = []
# GitHub and Azure DevOps adapters (M2).
platform = []

[dependencies]
vet-core.workspace = true
vet-semantic.workspace = true
vet-app.workspace = true
notify = "8.2.0"
tokio = { version = "1.53.2", features = ["sync", "time", "macros", "rt"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
