[package]
name = "vet-mock"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Mock orchestrator for the shell spike (SPEC §12.0): the real transport and
# handshake, answering from a real git changeset. It shells out to the `git`
# CLI; the real backend uses gitoxide (§6.3). Depends only on the transport, the
# protocol, `vet-core` and the view shaping of `vet-app`.
[dependencies]
vet-app.workspace = true
vet-core.workspace = true
vet-highlight.workspace = true
vet-mapping.workspace = true
vet-protocol.workspace = true
vet-transport.workspace = true
vet-log.workspace = true
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
