# Composition root: the only crate that sees every adapter.
[dependencies]
vet-core.workspace = true
vet-protocol.workspace = true
vet-transport.workspace = true
vet-semantic.workspace = true
vet-app.workspace = true
vet-infra.workspace = true
vet-highlight.workspace = true
vet-mapping.workspace = true
vet-log.workspace = true
tracing.workspace = true
futures = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
base64.workspace = true
futures-util = { workspace = true, features = ["sink"] }
