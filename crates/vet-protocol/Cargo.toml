[package]
name = "vet-protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The wire contract between shell and backend (I5). No workspace dependencies:
# the mock server and the real backend both build against this alone, without
# compiling gitoxide, SQLite or the LSP client. TS types are generated from it
# (`cargo test -p vet-protocol`, output in ui/src/generated; see .cargo/config.toml).
[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = "12"

[lints]
workspace = true
