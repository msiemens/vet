[package]
name = "vet-protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The wire contract between shell and backend. No workspace dependencies:
# the transport builds against this alone, without compiling gitoxide, SQLite or
# the LSP client. TS types are generated from it
# (`cargo test -p vet-protocol`, output in ui/src/generated; see .cargo/config.toml).
[dependencies]
serde = { workspace = true, features = ["derive"] }
ts-rs.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
