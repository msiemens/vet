[package]
name = "vet-host"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The logic of the Tauri host that needs no window: the backend process and its respawn policy,
# path translation for WSL, the allow-list of addresses to open, and the index of credential hosts.
# The host is built on its own, outside this workspace, and keeps only the Tauri glue.
[dependencies]
vet-protocol.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true

[lints]
workspace = true
