[workspace]
resolver = "3"
members = [
    "crates/vet-core",
    "crates/vet-protocol",
    "crates/vet-transport",
    "crates/vet-semantic",
    "crates/vet-app",
    "crates/vet-infra",
    "crates/vet-backend",
    "crates/vet-highlight",
    "crates/vet-mapping",
    "crates/vet-log",
    "crates/vet-engine",
]

# The Tauri host pulls in a large dependency tree and system webview libraries;
# it is built on its own, with `pnpm tauri`.
exclude = ["ui/src-tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

# Dependency direction is enforced by ci/check-deps.sh; keep it in sync when
# adding a path dependency here.
[workspace.dependencies]
vet-core = { path = "crates/vet-core" }
vet-protocol = { path = "crates/vet-protocol" }
vet-transport = { path = "crates/vet-transport" }
vet-semantic = { path = "crates/vet-semantic" }
vet-app = { path = "crates/vet-app" }
vet-infra = { path = "crates/vet-infra" }
vet-highlight = { path = "crates/vet-highlight" }
vet-mapping = { path = "crates/vet-mapping" }
vet-log = { path = "crates/vet-log" }
vet-engine = { path = "crates/vet-engine" }

# External dependencies: the version of each is set here only. Members add the features
# they need; where the defaults are off here, members name every feature they use.
tokio = "1.53.2"
tokio-tungstenite = "0.30"
futures = { version = "0.3", default-features = false }
futures-util = { version = "0.3", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false }
dirs = "7.0.0"
tempfile = "3.27.0"
base64 = "0.22"
hex = "0.4"
getrandom = "0.4"
subtle = "2"
ts-rs = "12"
blake3 = { version = "1.8.7", default-features = false }
globset = { version = "0.4.20", default-features = false }
imara-diff = { package = "gix-imara-diff", version = "0.3.0" }
similar = { version = "3.2.0", default-features = false }
unicode-normalization = { version = "0.1", default-features = false }
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13.4", default-features = false }
tree-sitter = "0.27.0"
tree-sitter-bash = "0.25.1"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-css = "0.25.0"
tree-sitter-highlight = "0.27.0"
tree-sitter-html = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
sea-orm = { version = "2.0.4", default-features = false }
sea-orm-migration = { version = "2.0.4", default-features = false }
gix = { version = "0.88", default-features = false }
lsp-types = "0.97"
toml = { version = "1.1", default-features = false }
regex = { version = "1.13", default-features = false }
regex-syntax = { version = "0.8", default-features = false }
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false }
rustls = { version = "0.23", default-features = false }
octocrab = { version = "0.54.2", default-features = false }
azure_devops_rust_api = { version = "0.39.1", default-features = false }
azure_core = { version = "1", default-features = false }
async-trait = "0.1"
tower = { version = "0.5", default-features = false }
http = "1.5.0"
time = { version = "0.3", default-features = false }
notify = "8.2.0"
rustix = "1.1"
windows-sys = "0.61"
junction = "2.1.0"

# `deny`, not `forbid`: a forbidden lint cannot be re-allowed, and the Windows watcher
# and job-object modules in vet-infra need a narrow `#![allow(unsafe_code)]`. They are the only ones.
[workspace.lints.rust]
unsafe_code = "deny"

# Debug info dominates link time: file:line backtraces for our crates, none for dependencies.
# Dependencies are optimized: the hot paths (gitoxide, diffing, SQLite) are theirs, and
# they are built once.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
