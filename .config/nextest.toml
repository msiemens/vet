# cargo-nextest: `cargo nextest run --workspace`. Every test runs in its own
# process; test binaries run in parallel.

[test-groups]
# Tests that start real language servers or run real restores (rust-analyzer,
# typescript-language-server, pyright, roslyn, dotnet, npm). Several at once
# compete for CPU and slow each other past their own timeouts.
language-servers = { max-threads = 2 }
# The load tests (`vet-backend`'s `load` module): each runs a backend against servers that are
# stuck on purpose, three of them on a repository of 300 changed files whose diff is CPU work.
# They run one at a time, so that two of them do not slow each other.
load = { max-threads = 1 }
# The Roslyn tests: each restores a project of its own into one shared NuGet cache and starts a
# server that loads it; they run one at a time.
roslyn = { max-threads = 1 }

[profile.default]
# Report a test as slow after 30 s; kill it after 4 periods (2 min), so a server
# that never answers fails its test instead of hanging the run.
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "immediate-final"

[[profile.default.overrides]]
filter = 'package(vet-infra) & binary(it) & test(/^lsp::roslyn/)'
test-group = "roslyn"

[[profile.default.overrides]]
filter = 'binary(it) & ((package(vet-infra) & test(/^(lsp|servers|restore)::/)) | (package(vet-backend) & test(/^(semantic|restore|python)::/)))'
test-group = "language-servers"

# A load test waits on work that is stuck on purpose and bounds each request at 120 s itself, so
# nextest's kill comes later than that when a busy machine starves its diffs and hashes.
[[profile.default.overrides]]
filter = 'package(vet-backend) & binary(it) & test(/^load::/)'
test-group = "load"
slow-timeout = { period = "60s", terminate-after = 4 }
