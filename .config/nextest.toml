# cargo-nextest: `cargo nextest run --workspace`. Every test runs in its own
# process; test binaries run in parallel.

[test-groups]
# Tests that start real language servers or run real restores (rust-analyzer,
# typescript-language-server, pyright, roslyn, dotnet, npm). Several at once
# compete for CPU and slow each other past their own timeouts.
language-servers = { max-threads = 2 }
# The load tests (`vet-backend`'s `load` module): each runs a backend on a 300-file repository against
# servers that are stuck on purpose, and counts on the whole machine. They run one at a time.
load = { max-threads = 1 }

[profile.default]
# Report a test as slow after 30 s; kill it after 4 periods (2 min), so a server
# that never answers fails its test instead of hanging the run.
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "immediate-final"

[[profile.default.overrides]]
filter = 'binary(it) & ((package(vet-infra) & test(/^(lsp|servers|restore)::/)) | (package(vet-backend) & test(/^(semantic|restore|python)::/)))'
test-group = "language-servers"

# A load test also takes every test thread, so that nothing else runs beside it and takes the
# CPU its diffs and hashes need: under a full parallel run it would otherwise be starved past
# the timeout above while it passes alone.
[[profile.default.overrides]]
filter = 'package(vet-backend) & binary(it) & test(/^load::/)'
test-group = "load"
threads-required = "num-test-threads"
