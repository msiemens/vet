[package]
name = "vet-shell"
version = "0.0.0"
edition = "2024"
publish = false

# Built on its own (`pnpm tauri dev`), outside the main workspace: Tauri brings a
# large dependency tree and needs the system webview (WebView2, WKWebView).
# The shell is a thin client (I5): it spawns the backend, reads its Ready line,
# and hands the address to the webview. No product logic lives here.
[workspace]

[lib]
name = "vet_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
vet-protocol = { path = "../../crates/vet-protocol" }
vet-log = { path = "../../crates/vet-log" }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-dialog = "2"
tauri-plugin-decoration = "3"
# The OS keychain (macOS Keychain, Windows Credential Manager) for personal access tokens.
keyring = "4.2"

# The system's double-click time (the mouse settings).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse"] }

# `input.rs` calls one system function that Windows' bindings mark unsafe.
[lints.rust]
unsafe_code = "deny"

# Debug info dominates link time: file:line backtraces for our crates, none for dependencies.
# Dependencies are optimized: they are built once.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2
